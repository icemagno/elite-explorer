<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="trade.page_title">Elite Explorer Copilot - Rotas de Mercado & Cotações</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="hud-container">
        <!-- Navigation Bar -->
        <nav class="top-nav">
            <a href="/index.html" class="nav-tab cyan">
                <span>🌌</span>
                <span data-i18n="nav.galaxy_cube_3d">Cubo Galáctico 3D</span>
            </a>
            <a href="/system-orrery.html" class="nav-tab">
                <span>🪐</span>
                <span data-i18n="nav.system_orrery">Sistema 3D (Orrery)</span>
            </a>
            <a href="/copilot.html" class="nav-tab">
                <span>🛰️</span>
                <span data-i18n="nav.copilot">Copilot em Tempo Real (Journal)</span>
            </a>
            <a href="/trade.html" class="nav-tab active">
                <span>🔄</span>
                <span data-i18n="nav.trade_loops">Rotas de Loop</span>
            </a>
            <div data-lang-switcher style="margin-left: auto;"></div>
        </nav>

        <!-- Header -->
        <header class="hud-header">
            <div class="hud-title-wrap">
                <div class="hud-logo">ED</div>
                <div>
                    <h1 class="hud-title">Elite Dangerous <span>Trade Hub</span></h1>
                    <p class="hud-subtitle" data-i18n="trade.subtitle">Cotações e Rotas de Mercado Otimizadas (Via Inara API/Scraper)</p>
                </div>
            </div>
            <div class="hud-status-badge">
                <span class="status-dot"></span>
                <span>Inara Online</span>
            </div>
        </header>

        <!-- Parameters / Filter Control Panel -->
        <section class="control-panel">
            <form id="searchForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="inputSystem" data-i18n="trade.center_system">Sistema de Centro da Busca (Origem)</label>
                        <input type="text" id="inputSystem" class="input-field" value="Col 285 Sector EG-D a42-1" required data-i18n-placeholder="trade.center_placeholder" placeholder="Ex: Sol, Shinrarta Dezhra...">
                    </div>
                    <div class="form-group">
                        <label for="inputCargo" data-i18n="trade.ship_cargo">Carga da Nave (T)</label>
                        <input type="number" id="inputCargo" class="input-field" value="36" min="1" max="1000" required>
                    </div>
                    <div class="form-group">
                        <label for="inputMaxDist" data-i18n="trade.max_dist">Distância Máx. (Ly)</label>
                        <input type="number" id="inputMaxDist" class="input-field" value="80" min="1" max="1000" required>
                    </div>
                    <div class="form-group">
                        <label for="inputPadSize" data-i18n="trade.pad_size">Pad de Pouso</label>
                        <select id="inputPadSize" class="input-field">
                            <option value="1" selected data-i18n="trade.pad_any">Qualquer / Grande (L)</option>
                            <option value="2" data-i18n="copilot.pad_med">Médio (M)</option>
                            <option value="3" data-i18n="copilot.pad_small">Pequeno (S)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="inputMaxAge" data-i18n="trade.max_age">Idade Máx. Dados</label>
                        <select id="inputMaxAge" class="input-field">
                            <option value="24" data-i18n="trade.hours_24">24 horas</option>
                            <option value="48" data-i18n="trade.hours_48">48 horas</option>
                            <option value="72" selected data-i18n="trade.hours_72">72 horas</option>
                            <option value="168" data-i18n="trade.days_7">7 dias</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <button type="submit" id="btnRefresh" class="btn-refresh">
                            <span id="btnSpinner" class="spinner" style="display: none;"></span>
                            <span id="btnText" data-i18n="trade.btn_refresh">Atualizar</span>
                        </button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Error Notification Box -->
        <div id="errorBox" class="alert-error"></div>

        <!-- Tool Bar -->
        <div class="tool-bar">
            <div class="tool-left">
                <span><span data-i18n="trade.routes_found">Rotas Encontradas:</span> <strong id="badgeCount" class="badge-count">0</strong></span>
                <span>| <span data-i18n="copilot.last_search">Última busca:</span> <span id="lastFetchedAt">-</span></span>
                <span>| <a id="inaraLink" href="#" target="_blank" rel="noopener noreferrer" data-i18n="copilot.view_inara" style="color: var(--accent-cyan); text-decoration: none;">Ver busca no Inara ↗</a></span>
            </div>
            <div class="tool-right">
                <input type="text" id="filterInput" class="filter-input" data-i18n-placeholder="trade.filter_placeholder" placeholder="Filtrar por estação, sistema ou mercadoria...">
                <select id="sortSelect" class="sort-select">
                    <option value="trip" data-i18n="trade.sort_trip">Ordenar: Maior Lucro / Viagem</option>
                    <option value="unit" data-i18n="trade.sort_unit">Ordenar: Maior Lucro / Unidade</option>
                    <option value="hour" data-i18n="trade.sort_hour">Ordenar: Maior Lucro / Hora</option>
                    <option value="route_dist_asc" data-i18n="trade.sort_route_dist">Ordenar: Menor Distância da Rota</option>
                    <option value="dist_center_asc" data-i18n="trade.sort_center_dist">Ordenar: Mais Próximo do Centro</option>
                </select>
            </div>
        </div>

        <!-- Routes Cards / List -->
        <main id="routesList" class="routes-container">
            <!-- Dynamic items rendered by app.js -->
        </main>
    </div>

    <!-- Clipboard Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="/js/i18n.js?v=20261112-1"></script>
    <script src="/js/app.js?v=20261112-1"></script>
</body>
</html>
