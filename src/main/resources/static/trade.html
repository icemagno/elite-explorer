<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Explorer Copilot - Rotas de Mercado & Cotações</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="hud-container">
        <!-- Navigation Bar -->
        <nav class="top-nav">
            <a href="/index.html" class="nav-tab cyan">
                <span>🌌</span>
                <span>Cubo Galáctico 3D</span>
            </a>
            <a href="/system-orrery.html" class="nav-tab">
                <span>🪐</span>
                <span>Sistema 3D (Orrery)</span>
            </a>
            <a href="/copilot.html" class="nav-tab">
                <span>🛰️</span>
                <span>Copilot em Tempo Real (Journal)</span>
            </a>
            <a href="/trade.html" class="nav-tab active">
                <span>🔄</span>
                <span>Rotas de Loop</span>
            </a>
        </nav>

        <!-- Header -->
        <header class="hud-header">
            <div class="hud-title-wrap">
                <div class="hud-logo">ED</div>
                <div>
                    <h1 class="hud-title">Elite Dangerous <span>Trade Hub</span></h1>
                    <p class="hud-subtitle">Cotações e Rotas de Mercado Otimizadas (Via Inara API/Scraper)</p>
                </div>
            </div>
            <div class="hud-status-badge">
                <span class="status-dot"></span>
                <span>Inara Online</span>
            </div>
        </header>

        <!-- Parameters / Filter Control Panel -->
        <section class="control-panel">
            <form id="searchForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="inputSystem">Sistema de Centro da Busca (Origem)</label>
                        <input type="text" id="inputSystem" class="input-field" value="Col 285 Sector EG-D a42-1" required placeholder="Ex: Sol, Shinrarta Dezhra...">
                    </div>
                    <div class="form-group">
                        <label for="inputCargo">Carga da Nave (T)</label>
                        <input type="number" id="inputCargo" class="input-field" value="36" min="1" max="1000" required>
                    </div>
                    <div class="form-group">
                        <label for="inputMaxDist">Distância Máx. (Ly)</label>
                        <input type="number" id="inputMaxDist" class="input-field" value="80" min="1" max="1000" required>
                    </div>
                    <div class="form-group">
                        <label for="inputPadSize">Pad de Pouso</label>
                        <select id="inputPadSize" class="input-field">
                            <option value="1" selected>Qualquer / Grande (L)</option>
                            <option value="2">Médio (M)</option>
                            <option value="3">Pequeno (S)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="inputMaxAge">Idade Máx. Dados</label>
                        <select id="inputMaxAge" class="input-field">
                            <option value="24">24 horas</option>
                            <option value="48">48 horas</option>
                            <option value="72" selected>72 horas</option>
                            <option value="168">7 dias</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <button type="submit" id="btnRefresh" class="btn-refresh">
                            <span id="btnSpinner" class="spinner" style="display: none;"></span>
                            <span id="btnText">Atualizar</span>
                        </button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Error Notification Box -->
        <div id="errorBox" class="alert-error"></div>

        <!-- Tool Bar -->
        <div class="tool-bar">
            <div class="tool-left">
                <span>Rotas Encontradas: <strong id="badgeCount" class="badge-count">0</strong></span>
                <span>| Última busca: <span id="lastFetchedAt">-</span></span>
                <span>| <a id="inaraLink" href="#" target="_blank" rel="noopener noreferrer" style="color: var(--accent-cyan); text-decoration: none;">Ver busca no Inara ↗</a></span>
            </div>
            <div class="tool-right">
                <input type="text" id="filterInput" class="filter-input" placeholder="Filtrar por estação, sistema ou mercadoria...">
                <select id="sortSelect" class="sort-select">
                    <option value="trip">Ordenar: Maior Lucro / Viagem</option>
                    <option value="unit">Ordenar: Maior Lucro / Unidade</option>
                    <option value="hour">Ordenar: Maior Lucro / Hora</option>
                    <option value="route_dist_asc">Ordenar: Menor Distância da Rota</option>
                    <option value="dist_center_asc">Ordenar: Mais Próximo do Centro</option>
                </select>
            </div>
        </div>

        <!-- Routes Cards / List -->
        <main id="routesList" class="routes-container">
            <!-- Dynamic items rendered by app.js -->
        </main>
    </div>

    <!-- Clipboard Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="/js/app.js"></script>
</body>
</html>
