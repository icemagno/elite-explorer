server.port=8080
spring.application.name=elite-explorer
logging.level.com.eliteexplorer=INFO

# Sincronização e Telemetria Voluntária EDSM (Elite Dangerous Star Map)
# Parametrize via linha de comando ou no arquivo iniciar.bat (--edsm.commander.name / --edsm.api.key)
edsm.sync.enabled=true
edsm.api.key=
edsm.commander.name=

# Publicação e Telemetria para a rede galáctica EDDN (Elite Dangerous Data Network)
eddn.publish.enabled=true
eddn.publish.test=false


